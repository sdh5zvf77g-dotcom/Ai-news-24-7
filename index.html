<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0f13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AI News">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<title>AI News</title>
<style>
:root{--bg:#0e0f13;--card:#181a21;--tx:#eef0f5;--mu:#8e93a3;--bd:#262933;--ac:#7c8cff}
@media(prefers-color-scheme:light){:root{--bg:#f4f5f9;--card:#fff;--tx:#14161c;--mu:#666b7a;--bd:#e3e5ec;--ac:#4a5bd8}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 -apple-system,system-ui,sans-serif;padding:calc(env(safe-area-inset-top) + 8px) 0 calc(env(safe-area-inset-bottom) + 16px)}
main{max-width:680px;margin:0 auto;padding:0 16px}
header{display:flex;justify-content:space-between;align-items:center}
h1{font-size:26px;margin:8px 0}
button{font:inherit}
#ref{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:8px 14px}
.sub{color:var(--mu);font-size:13px;margin:0 0 12px}
input{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font-size:16px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0}
.chip{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:6px 12px;border-radius:999px;font-size:14px}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
a.card{display:block;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:10px;color:inherit;text-decoration:none}
.m{font-size:12px;color:var(--mu);display:flex;justify-content:space-between}
.m b{color:var(--ac)}
.card h2{font-size:17px;margin:6px 0 4px}.card p{margin:0;font-size:14px;color:var(--mu)}
</style></head><body><main>
<header><h1>AI News</h1><button id="ref">Refresh</button></header>
<p class="sub" id="up">Loading…</p>
<input id="q" placeholder="Search models, companies…">
<div class="chips" id="chips"></div>
<div id="list"></div>
</main>
<script>
let D=null,co="All";
const $=id=>document.getElementById(id);
function ago(s){const m=Math.max(1,Math.round((Date.now()-new Date(s))/6e4));
 if(m<60)return m+"m ago";if(m<1440)return Math.round(m/60)+"h ago";return Math.round(m/1440)+"d ago"}
async function load(){
 $("up").textContent="Updating…";
 try{const r=await fetch("news.json?t="+Date.now(),{cache:"no-store"});D=await r.json();
  try{localStorage.setItem("n",JSON.stringify(D))}catch(e){}}
 catch(e){try{D=JSON.parse(localStorage.getItem("n"))}catch(x){}}
 if(!D){$("up").textContent="Offline and nothing saved yet.";return}
 $("up").textContent="Updated "+ago(D.updated)+" · auto-refreshes every time you open the app";
 chips();draw();
}
function chips(){const cs=["All",...new Set(D.items.map(i=>i.company))];$("chips").innerHTML="";
 cs.forEach(c=>{const b=document.createElement("button");b.className="chip"+(c===co?" on":"");b.textContent=c;b.onclick=()=>{co=c;chips();draw()};$("chips").appendChild(b)})}
function draw(){const t=$("q").value.toLowerCase(),L=$("list");L.innerHTML="";
 D.items.filter(i=>(co==="All"||i.company===co)&&(i.title+i.summary+i.source).toLowerCase().includes(t)).forEach(i=>{
  const a=document.createElement("a");a.className="card";a.href=i.link;a.target="_blank";a.rel="noopener";
  a.innerHTML='<div class="m"><span><b></b> · <i></i></span><span></span></div><h2></h2><p></p>';
  a.querySelector("b").textContent=i.company;a.querySelector("i").textContent=i.source;
  a.querySelector(".m").lastChild.textContent=ago(i.date);
  a.querySelector("h2").textContent=i.title;a.querySelector("p").textContent=i.summary;L.appendChild(a)})}
$("q").oninput=()=>D&&draw();$("ref").onclick=load;
document.addEventListener("visibilitychange",()=>{if(!document.hidden)load()});
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js");
load();
</script></body></html>
